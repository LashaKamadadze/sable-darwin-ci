name: sable-desktop on aarch64-darwin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or commit of LashaKamadadze/nixpkgs to build
        default: sable-desktop-darwin

jobs:
  build:
    # Apple Silicon runner, free for public repositories
    runs-on: macos-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          df -h /
          # Nix does not need the Android SDK or the extra Xcode versions
          sudo rm -rf ~/Library/Android /Users/runner/Library/Android || true
          current=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in /Applications/Xcode*.app; do
            [ "$x" = "$current" ] || sudo rm -rf "$x"
          done
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          REF: ${{ inputs.ref }}
        run: |
          nix build "github:LashaKamadadze/nixpkgs/$REF#sable-desktop" \
            -L --max-jobs 1 --cores 3
          nix path-info -Sh ./result

      - name: Inspect the bundle and its signature
        # informational: a broken resource seal does not stop a local app from starting
        continue-on-error: true
        run: |
          app=result/Applications/Sable.app
          ls -la $app/Contents $app/Contents/Resources $app/Contents/_CodeSignature || true
          cat $app/Contents/Resources/package-type
          file $app/Contents/Resources/* | sed 's|.*/Resources/||'
          head -c 64 $app/Contents/Resources/sable-tray.ico | xxd | head -4
          codesign -dvvv $app 2>&1 | head -30
          codesign -dvvv $app/Contents/MacOS/Sable 2>&1 | head -20
          codesign --verify --deep --strict --verbose=4 $app 2>&1 | tail -30

      - name: Launch and take a screenshot
        run: |
          result/Applications/Sable.app/Contents/MacOS/Sable > sable.log 2>&1 &
          sleep 60
          screencapture -x sable.png
          tail -50 sable.log
          if ! pgrep -fl Sable.app; then
            echo "Sable is not running, crash reports:"
            ls -t ~/Library/Logs/DiagnosticReports | head -5
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-darwin
          path: |
            sable.png
            sable.log
          if-no-files-found: ignore
