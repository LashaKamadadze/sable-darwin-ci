name: sable-desktop on aarch64-darwin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch or commit of LashaKamadadze/nixpkgs to build
        default: sable-desktop-darwin

jobs:
  build:
    # Apple Silicon runner, free for public repositories
    runs-on: macos-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          df -h /
          # Nix does not need the Android SDK or the extra Xcode versions
          sudo rm -rf ~/Library/Android /Users/runner/Library/Android || true
          current=$(xcode-select -p | sed 's|/Contents/Developer||')
          for x in /Applications/Xcode*.app; do
            [ "$x" = "$current" ] || sudo rm -rf "$x"
          done
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          REF: ${{ inputs.ref }}
        run: |
          nix build "github:LashaKamadadze/nixpkgs/$REF#sable-desktop" \
            -L --max-jobs 1 --cores 3
          nix path-info -Sh ./result

      - name: Inspect the bundle
        continue-on-error: true
        run: |
          app=result/Applications/Sable.app
          ls -la $app/Contents/Resources $app/Contents/_CodeSignature
          file $app/Contents/Resources/* | sed 's|.*/Resources/||'
          codesign -dvvv $app 2>&1 | head -20

      - name: Launch through bin/sable and take a screenshot
        run: |
          result/bin/sable > sable.log 2>&1 &
          sleep 90
          screencapture -x sable.png
          tail -60 sable.log
          if ! pgrep -fl Sable.app; then
            echo "::error::Sable is not running"
            ls -t ~/Library/Logs/DiagnosticReports | head -5
            exit 1
          fi

      - name: Check the fixes
        run: |
          app=result/Applications/Sable.app
          fail=0
          echo "== bundle signature (Apple codesign, strict)"
          codesign --verify --deep --strict --verbose=2 $app || { echo "::error::signature does not verify"; fail=1; }
          echo "== Info.plist and resources are bound to the signature"
          codesign -dvvv $app 2>&1 | grep -E 'Info.plist=|Sealed Resources=' | tee sig.txt
          if grep -q 'not bound\|=none' sig.txt; then echo "::error::signature has no bundle seal"; fail=1; fi
          echo "== package-type"
          [ "$(cat $app/Contents/Resources/package-type)" = nix ] || { echo "::error::package-type missing"; fail=1; }
          echo "== sable-tray.ico is the 18392-byte icon from the source"
          size=$(stat -f %z $app/Contents/Resources/sable-tray.ico); echo "size $size"
          [ "$size" = 18392 ] || { echo "::error::sable-tray.ico is $size bytes"; fail=1; }
          echo "== the updater stays off"
          if grep -q 'Checking for update' sable.log; then echo "::error::updater ran"; fail=1; else echo "no update check in the log"; fi
          echo "== the Rust core reached a homeserver"
          grep -q 'sign-in methods discovered' sable.log && echo ok || { echo "::error::no homeserver discovery in the log"; fail=1; }
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sable-darwin
          path: |
            sable.png
            sable.log
          if-no-files-found: ignore
